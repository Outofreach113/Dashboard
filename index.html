      tools:[{functionDeclarations:[{name:"refresh_planner",description:"Get the freshest planner briefing (tasks due, exams, today's schedule and work shifts, stock quotes and holdings) when the answer may have changed or isn't covered by the current briefing.",parameters:{type:"OBJECT",properties:{}}}]}],
      inputAudioTranscription:{},outputAudioTranscription:{},
      realtimeInputConfig:{automaticActivityDetection:{disabled:false,startOfSpeechSensitivity:"START_SENSITIVITY_HIGH",endOfSpeechSensitivity:"END_SENSITIVITY_HIGH",prefixPaddingMs:20,silenceDurationMs:500}},
      sessionResumption:V.resumeHandle?{handle:V.resumeHandle}:{}
    }}));
  };
  ws.onmessage=function(ev){
    if(typeof ev.data==="string")vHandleMessage(ev.data);
    else if(ev.data instanceof Blob)ev.data.text().then(vHandleMessage).catch(function(){});
  };
  ws.onerror=function(){/* onclose handles recovery */};
  ws.onclose=function(){
    if(V.ws===ws)V.ws=null;
    if(!V.wantLive)return; /* explicit End already tore everything down */
    if(V.reconnects<3){
      V.reconnects++;V.status="connecting";
      if(V.open)vRender();
      V.reconnectTimer=setTimeout(function(){if(V.wantLive)vReconnect()},1200*V.reconnects);
    }else{
      V.wantLive=false;vTeardown();V.status="error";
      V.error="Jarvis's connection dropped and couldn't be restored. Check that your Gemini key is valid in Settings — on the free tier, sessions can also end when usage limits are reached.";
      if(V.open)vRender();else vRender();
    }
  };
}
async function vReconnect(){
  if(V.mode==="voice"&&!V.stream){
    var mic=await vAcquireMic();
    if(mic.ok){V.stream=mic.stream}
    else{V.mode="typed";V.fallbackNote=mic.failure.message}
  }
  if(V.wantLive)vConnect();
}
async function vStart(typedOnly){
  if(typeof stopWakeListening==="function")stopWakeListening();
  V.wantLive=false;vTeardown();
  V.error=null;V.micFailure=null;V.fallbackNote=null;V.history=[];V.capUser="";V.capAsst="";V.userPartial="";V.asstPartial="";
  V.muted=false;V.speaking=false;V.greeted=false;V.resumeHandle=null;V.reconnects=0;
  V.wantLive=true;V.status="connecting";vRender();
  try{
    if(typedOnly){V.mode="typed";V.fallbackNote="Typing mode — Jarvis answers out loud."}
    else{
      var mic=await vAcquireMic();
      if(mic.ok){V.mode="voice";V.stream=mic.stream}
      else{V.mode="typed";V.micFailure=mic.failure;V.fallbackNote=mic.failure.message}
    }
    if(!V.wantLive)return; /* user cancelled while the mic prompt was up */
    vConnect();
  }catch(e){
    V.wantLive=false;vTeardown();V.status="error";V.error=(e&&e.message)||"Jarvis couldn't start the voice session.";vRender();
  }
}
function vSendText(text){
  text=(text||"").trim();
  if(!text||V.status!=="live"||!V.ws||V.ws.readyState!==WebSocket.OPEN)return;
  vStopPlayback();
  V.userPartial=V.userPartial?V.userPartial+" "+text:text;V.capUser=V.userPartial;
  V.ws.send(JSON.stringify({clientContent:{turns:[{role:"user",parts:[{text:text}]}],turnComplete:true}}));
  vRender();
}
function vEnd(){
  V.wantLive=false;vTeardown();
  V.status="idle";V.mode="voice";V.speaking=false;V.muted=false;V.fallbackNote=null;V.micFailure=null;V.error=null;V.greeted=false;V.resumeHandle=null;V.reconnects=0;
  V.userPartial="";V.asstPartial="";V.capUser="";V.capAsst="";
  vRender();
  if(typeof WAKE!=="undefined"&&WAKE.enabled&&typeof startWakeListening==="function")setTimeout(startWakeListening,500);
}
function vClosePanel(){V.open=false;jarvisStopVisuals();vRender()}
/* ===== Wake word: “Hey Jarvis” ===== */
var WAKE={enabled:false,rec:null,active:false,error:null,restartTimer:null};
try{WAKE.enabled=localStorage.getItem("dp_wake_enabled")==="1"}catch(e){}
function wakeSupported(){return !!(window.SpeechRecognition||window.webkitSpeechRecognition)}
function updateWakeUI(){
  var fab=$("wakeFab"),lab=$("wakeFabLabel");
  if(fab){fab.classList.toggle("on",WAKE.enabled&&WAKE.active);fab.setAttribute("aria-pressed",WAKE.enabled?"true":"false")}
  if(lab)lab.textContent=WAKE.enabled?"Wake: On":"Wake: Off";
  var note=$("wakeSettingsNote");if(note)note.textContent=WAKE.error||(WAKE.enabled?"Listening for “Hey Jarvis”…":"Off");
  var btn=$("wakeToggleSettings");if(btn)btn.textContent="Wake word: "+(WAKE.enabled?"On":"Off");
}
function stopWakeListening(){
  if(WAKE.restartTimer)clearTimeout(WAKE.restartTimer);WAKE.restartTimer=null;
  if(WAKE.rec){var r=WAKE.rec;WAKE.rec=null;try{r.onend=null;r.onerror=null;r.onresult=null;r.stop()}catch(e){try{r.abort()}catch(e2){}}}
  WAKE.active=false;updateWakeUI();
}
function startWakeListening(){
  if(!WAKE.enabled||WAKE.active||V.wantLive||V.status==="live"||V.status==="connecting")return;
  if(!wakeSupported()){WAKE.error="Wake word needs browser speech recognition — Chrome works best. Jarvis still opens with the Jarvis button.";updateWakeUI();if(V.open)vRender();return}
  try{
    var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    var rec=new SR();WAKE.rec=rec;rec.continuous=true;rec.interimResults=true;rec.lang="en-US";rec.maxAlternatives=3;
    rec.onresult=function(ev){
      for(var i=ev.resultIndex;i<ev.results.length;i++){
        for(var j=0;j<ev.results[i].length;j++){
          var norm=String(ev.results[i][j].transcript||"").toLowerCase().replace(/[^a-z\s]/g," ").replace(/\s+/g," ").trim();
          if(norm.indexOf("hey jarvis")>=0||norm.indexOf("hey jarv is")>=0||norm.indexOf("a jarvis")>=0&&norm.indexOf("hey")>=0){triggerWakeWord();return}
        }
      }
    };
    rec.onerror=function(e){
      WAKE.active=false;
      if(e&&e.error==="not-allowed"){WAKE.error="Microphone permission is needed for wake word. Allow the mic for this site, then turn wake word on again.";WAKE.enabled=false;try{localStorage.removeItem("dp_wake_enabled")}catch(err){}}
      else if(e&&e.error==="not-supported"){WAKE.error="Wake word isn’t supported in this browser.";WAKE.enabled=false}
      updateWakeUI();if(V.open)vRender();
    };
    rec.onend=function(){WAKE.active=false;WAKE.rec=null;updateWakeUI();if(WAKE.enabled&&!V.wantLive){WAKE.restartTimer=setTimeout(startWakeListening,700)}};
    rec.start();WAKE.active=true;WAKE.error=null;updateWakeUI();
  }catch(e){WAKE.active=false;WAKE.error="Wake word couldn’t start in this browser — Jarvis still opens with the Jarvis button.";updateWakeUI()}
}
function triggerWakeWord(){
  toast("Hey Jarvis — Jarvis is listening");
  stopWakeListening();
  V.open=true;
  if(CFG.gemini){vStart(false)}else{vRender()}
}
function setWakeEnabled(on){
  WAKE.enabled=!!on;WAKE.error=null;
  try{if(on)localStorage.setItem("dp_wake_enabled","1");else localStorage.removeItem("dp_wake_enabled")}catch(e){}
  if(on){updateWakeUI();startWakeListening();toast("Wake word on — say “Hey Jarvis” to start Jarvis")}
  else{stopWakeListening();toast("Wake word off")}
  updateWakeUI();
  if(V.open)vRender();
  if(currentView==="settings")renderView();
}
var wakeFabEl=$("wakeFab");if(wakeFabEl)wakeFabEl.addEventListener("click",function(){setWakeEnabled(!WAKE.enabled)});
updateWakeUI();
if(WAKE.enabled){/* will prompt for mic on first toggle in most browsers; try quietly */ setTimeout(startWakeListening,800)}
$("talkFab").addEventListener("click",function(){
  V.open=true;
  if((V.status==="idle"||V.status==="error")&&CFG.gemini){vStart(false)}
  else vRender();
});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&V.open)vClosePanel()});
</script>
